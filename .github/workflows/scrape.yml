name: LeadZen Scrape

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Açar söz (məsələn: restoran, stomatoloq)"
        required: true
        type: string
      location:
        description: "Şəhər və ya lokasiya (məsələn: Bakı)"
        required: true
        type: string
      target_count:
        description: "İstənilən nəticə sayı (1-100)"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Google Maps scraper
        run: |
          python scripts/run_scraper.py \
            --query "${{ inputs.query }}" \
            --location "${{ inputs.location }}" \
            --target-count "${{ inputs.target_count }}"

      - name: Upload Excel and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadzen-results-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
