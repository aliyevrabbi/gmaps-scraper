name: LeadZen Scrape

on:
  push:
    paths:
      - "config/search.json"
  workflow_dispatch:
    inputs:
      query:
        description: "Açar söz (məsələn: restoran, stomatoloq)"
        required: true
        type: string
      location:
        description: "Şəhər və ya lokasiya (məsələn: Bakı)"
        required: true
        type: string
      target_count:
        description: "İstənilən nəticə sayı (1-100)"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve search parameters
        id: search
        env:
          QUERY_INPUT: ${{ inputs.query }}
          LOCATION_INPUT: ${{ inputs.location }}
          TARGET_COUNT_INPUT: ${{ inputs.target_count }}
        run: |
          if [ -n "$QUERY_INPUT" ]; then
            {
              echo "query<<EOF"
              echo "$QUERY_INPUT"
              echo "EOF"
              echo "location<<EOF"
              echo "$LOCATION_INPUT"
              echo "EOF"
              echo "target_count=$TARGET_COUNT_INPUT"
            } >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("config/search.json", encoding="utf-8") as f:
              config = json.load(f)
          print(f"query={config['query']}")
          print(f"location={config['location']}")
          print(f"target_count={config['target_count']}")
          PY
          fi
          echo "Axtarış parametrləri hazırlandı."

      - name: Run Google Maps scraper
        run: |
          python scripts/run_scraper.py \
            --query "${{ steps.search.outputs.query }}" \
            --location "${{ steps.search.outputs.location }}" \
            --target-count "${{ steps.search.outputs.target_count }}"

      - name: Upload Excel and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadzen-results-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
